# 三角洲行动 口琴自动演奏 - 配置
# 以 # 或 ; 开头的是注释；改完存盘后重启程序生效。

[keys]
# 简谱 1..7 对应的按键（游戏口琴界面的默认布局）
d1=Z
d2=X
d3=C
d4=V
d5=B
d6=N
d7=M
d8=COMMA

[octave]
# 低音区 / 高音区 / 升半音 用哪个鼠标键作为修饰（按住式）
# 可选：left | middle | right | none
low=left
high=right
sharp=middle

[timing]
# 修饰键提前量：降调/升调/半音这几个鼠标键，提前多少毫秒按下。
# 游戏里修饰没生效、或者音区听起来不对，就把这个调大（比如 80）。
mouse_lead_ms=30

# 松键间隔：松开一个音之后，隔多少毫秒才按下一个音。
# 太小会让前后两个音粘连；一般 40 就够。
note_gap_ms=5
